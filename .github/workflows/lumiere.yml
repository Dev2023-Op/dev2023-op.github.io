name: Clone Repo on Dispatch

on:
  workflow_dispatch: # Allows manual triggering with a single click

jobs:
  clone-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Clone target repository
        run: |
          rm -rf lumiere/app
          git clone --depth 1 https://github.com/Dev2023-Op/lumiere-timer lumiere/app
          rm -rf lumiere/app/.git

      - name: Commit and push changes
        run: |
          git add lumiere/app
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated sync of cloned content"
          git push origin HEAD
