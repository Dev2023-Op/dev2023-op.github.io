<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Users JSON Manager — No npm required</title>
  <style>
    :root { --accent: #2b7cff; --max-width: 900px; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 20px; display:flex; justify-content:center; }
    main { width:100%; max-width:var(--max-width); }
    h1 { color:var(--accent); margin-bottom:8px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    button { padding:6px 10px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { border:1px solid #ddd; padding:8px; text-align:left; }
    tr:nth-child(even) { background:#fafafa; }
    input[type="text"], input[type="number"] { padding:6px; width:160px; }
    #message { margin-top:8px; padding:8px; border:1px solid #ddd; display:none; }
    .small { font-size:0.9rem; color:#444; }
    .muted { color:#666; font-size:0.85rem; }
    .file-controls { gap:6px; }
    .right { margin-left:auto; }
  </style>
</head>
<body>
  <main>
    <h1>Users JSON Manager</h1>

    <div class="row file-controls">
      <button id="newBtn">New (empty)</button>
      <button id="openBtn">Open file…</button>
      <input id="fileInput" type="file" accept=".json,application/json" style="display:none" />
      <button id="saveBtn" disabled>Save</button>
      <button id="saveAsBtn">Save as…</button>
      <button id="downloadBtn">Download JSON</button>

      <label class="muted right">
        <input id="autosaveLocal" type="checkbox" /> Autosave to localStorage
      </label>
    </div>

    <div class="row">
      <form id="createForm">
        <label>
          Name: <input id="nameInput" type="text" required />
        </label>
        <label>
          Balance: <input id="balanceInput" type="number" step="0.01" value="0" />
        </label>
        <button type="submit">Create user</button>
      </form>
    </div>

    <section>
      <h2 class="small">Users</h2>
      <div id="message"></div>
      <table id="usersTable" aria-live="polite">
        <thead>
          <tr><th>Name</th><th>Balance</th><th>New balance</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </section>

    <p class="muted">Notes: This is a single static HTML file — no npm, no server. For direct file read/write in the browser use Chrome/Edge (File System Access API). Other browsers can load via the "Open file" input and save via "Download JSON".</p>
  </main>

  <script>
    // Simple users manager that reads/writes a JSON file without any server.
    // - Uses File System Access API when available (open/save).
    // - Fallback: file input for loading, and download for saving.
    // - Autosave to localStorage optional.
    //
    // Data model: users = [{ id: string, name: string, balance: number }, ...]
    // Functions: create, delete, update balance, save, saveAs, open, new.

    const newBtn = document.getElementById('newBtn');
    const openBtn = document.getElementById('openBtn');
    const saveBtn = document.getElementById('saveBtn');
    const saveAsBtn = document.getElementById('saveAsBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const fileInput = document.getElementById('fileInput');
    const autosaveLocal = document.getElementById('autosaveLocal');

    const createForm = document.getElementById('createForm');
    const nameInput = document.getElementById('nameInput');
    const balanceInput = document.getElementById('balanceInput');

    const usersBody = document.getElementById('usersBody');
    const messageEl = document.getElementById('message');

    let users = [];
    let fileHandle = null; // FileSystemFileHandle when using File System Access API
    let hasFileSystemAccess = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;

    // Helpers
    function showMessage(text, isError=false, hideAfter=3000) {
      messageEl.textContent = text;
      messageEl.style.borderColor = isError ? '#f88' : '#ddd';
      messageEl.style.display = 'block';
      if (hideAfter) {
        setTimeout(() => { messageEl.style.display = 'none'; }, hideAfter);
      }
    }

    function genId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9);
    }

    function render() {
      usersBody.innerHTML = '';
      if (users.length === 0) {
        usersBody.innerHTML = '<tr><td colspan="4" class="muted">No users</td></tr>';
        return;
      }
      for (const u of users) {
        const tr = document.createElement('tr');

        const nameTd = document.createElement('td');
        const nameInputEl = document.createElement('input');
        nameInputEl.type = 'text';
        nameInputEl.value = u.name;
        nameInputEl.style.width = '100%';
        nameInputEl.addEventListener('change', () => {
          u.name = nameInputEl.value.trim();
          markDirty();
        });
        nameTd.appendChild(nameInputEl);
        tr.appendChild(nameTd);

        const balTd = document.createElement('td');
        balTd.textContent = Number(u.balance).toFixed(2);
        tr.appendChild(balTd);

        const inputTd = document.createElement('td');
        const newBalInput = document.createElement('input');
        newBalInput.type = 'number';
        newBalInput.step = '0.01';
        newBalInput.value = Number(u.balance).toFixed(2);
        newBalInput.style.width = '120px';
        inputTd.appendChild(newBalInput);
        tr.appendChild(inputTd);

        const actionsTd = document.createElement('td');
        const updateBtn = document.createElement('button');
        updateBtn.textContent = 'Update';
        updateBtn.addEventListener('click', () => {
          const val = parseFloat(newBalInput.value);
          if (Number.isNaN(val)) return alert('Enter a valid number');
          u.balance = val;
          markDirty();
          render();
          if (autosaveLocal.checked) saveToLocal();
        });
        const delBtn = document.createElement('button');
        delBtn.textContent = 'Delete';
        delBtn.style.marginLeft = '6px';
        delBtn.addEventListener('click', () => {
          if (!confirm(`Delete user "${u.name}"?`)) return;
          users = users.filter(x => x.id !== u.id);
          markDirty();
          render();
          if (autosaveLocal.checked) saveToLocal();
        });

        actionsTd.appendChild(updateBtn);
        actionsTd.appendChild(delBtn);
        tr.appendChild(actionsTd);

        usersBody.appendChild(tr);
      }
    }

    function markDirty() {
      saveBtn.disabled = false;
    }

    // File System Access API: open
    async function openWithFS() {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
          multiple: false
        });
        if (!handle) return;
        fileHandle = handle;
        const file = await handle.getFile();
        const text = await file.text();
        users = JSON.parse(text || '[]');
        showMessage('Opened ' + (file.name || 'file'), false);
        render();
        saveBtn.disabled = true;
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    }

    // File System Access API: save (to existing handle)
    async function saveWithFS() {
      if (!fileHandle) {
        await saveAsWithFS();
        return;
      }
      try {
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(users, null, 2));
        await writable.close();
        showMessage('Saved to file');
        saveBtn.disabled = true;
      } catch (err) {
        console.error(err);
        showMessage('Save failed: ' + (err.message || err), true);
      }
    }

    // File System Access API: save as
    async function saveAsWithFS() {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'users.json',
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
        });
        if (!handle) return;
        fileHandle = handle;
        await saveWithFS();
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    }

    // Fallback: load using file input
    function openWithInput(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          users = JSON.parse(reader.result || '[]');
          showMessage('Loaded file');
          render();
          saveBtn.disabled = false; // cannot overwrite original file; enable Save (download)
        } catch (err) {
          showMessage('Invalid JSON', true);
        }
      };
      reader.onerror = () => showMessage('Read error', true);
      reader.readAsText(file);
    }

    // Fallback: download JSON
    function downloadJSON() {
      const blob = new Blob([JSON.stringify(users, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'users.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showMessage('Download started');
      saveBtn.disabled = true;
    }

    // LocalStorage helpers
    const LS_KEY = 'users-json-manager-data';
    function saveToLocal() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(users));
        showMessage('Saved to localStorage', false, 1500);
        saveBtn.disabled = true;
      } catch (err) {
        console.error(err);
        showMessage('Failed to save to localStorage', true);
      }
    }
    function loadFromLocal() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return false;
        users = JSON.parse(raw);
        render();
        showMessage('Loaded from localStorage', false, 1500);
        return true;
      } catch (err) { return false; }
    }

    // Wiring UI
    openBtn.addEventListener('click', async () => {
      if (hasFileSystemAccess) {
        await openWithFS();
      } else {
        fileInput.click();
      }
    });

    fileInput.addEventListener('change', (e) => {
      const f = fileInput.files && fileInput.files[0];
      if (f) openWithInput(f);
      fileInput.value = '';
    });

    saveBtn.addEventListener('click', async () => {
      if (autosaveLocal.checked) {
        saveToLocal();
        return;
      }
      if (hasFileSystemAccess) {
        await saveWithFS();
      } else {
        // fallback to download
        downloadJSON();
      }
    });

    saveAsBtn.addEventListener('click', async () => {
      if (hasFileSystemAccess) {
        await saveAsWithFS();
      } else {
        downloadJSON();
      }
    });

    downloadBtn.addEventListener('click', () => downloadJSON());

    newBtn.addEventListener('click', () => {
      if (!confirm('Create a new empty users list? Unsaved changes will be lost.')) return;
      users = [];
      fileHandle = null;
      render();
      markDirty();
    });

    createForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const bal = parseFloat(balanceInput.value || '0');
      if (!name) return alert('Name required');
      if (Number.isNaN(bal)) return alert('Invalid balance');
      users.push({ id: genId(), name, balance: bal });
      nameInput.value = '';
      balanceInput.value = '0';
      render();
      markDirty();
      if (autosaveLocal.checked) saveToLocal();
    });

    // Auto-load from localStorage if present
    window.addEventListener('load', () => {
      autosaveLocal.checked = !!localStorage.getItem(LS_KEY);
      if (autosaveLocal.checked) loadFromLocal();
      render();
      // If browser supports FS API, hint to user
      if (hasFileSystemAccess) {
        showMessage('File System Access available — you can Open/Save files directly (Chrome/Edge).', false, 4000);
      } else {
        showMessage('No native File System Access API: use "Open file…" and "Download JSON" to load/save files.', false, 5000);
      }
    });

    // Warn before closing if there are unsaved changes and not autosaving to local
    window.addEventListener('beforeunload', (e) => {
      if (!autosaveLocal.checked && !saveBtn.disabled) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  </script>
</body>
</html>
